const labels={runeword:"룬워드",base:"베이스",unique:"유니크",item:"아이템",cube:"큐빙",zone:"사냥터"};
const icons={runeword:"◆",base:"▣",unique:"★",item:"✦",cube:"⬡",zone:"⌖"};
let cat="all", q="";
const favs=new Set(JSON.parse(localStorage.getItem("d2favs")||"[]"));
const grid=document.getElementById("grid"), count=document.getElementById("count");

function norm(s){return String(s||"").toLowerCase().replace(/\s+/g,"")}
function render(){
  const nq=norm(q);
  const list=DATA.filter(x=>(cat==="all"||x.category===cat) && (!nq || norm([x.name,x.enName,x.desc,x.sub,x.primary].join(" ")).includes(nq)));
  count.textContent=list.length;
  grid.innerHTML=list.length?list.map(x=>`<article class="card" data-id="${x.id}">
    <button class="fav ${favs.has(x.id)?"on":""}" data-fav="${x.id}" title="즐겨찾기">☆</button>
    <div class="kind">${icons[x.category]||"•"} ${labels[x.category]||x.category} ${x.sub||""}</div>
    <h3>${x.name}</h3><div class="en">${x.enName||""}</div><div class="desc">${x.desc||""}</div>
  </article>`).join(""):`<div class="empty">검색 결과가 없습니다.</div>`;
}
document.getElementById("search").addEventListener("input",e=>{q=e.target.value;render()});
document.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>{q=b.dataset.q;document.getElementById("search").value=q;render()});
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");cat=b.dataset.cat;render()});
grid.addEventListener("click",e=>{
  const f=e.target.closest("[data-fav]");
  if(f){e.stopPropagation();const id=f.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem("d2favs",JSON.stringify([...favs]));render();return}
  const c=e.target.closest(".card");if(!c)return;const x=DATA.find(v=>v.id===c.dataset.id);if(!x)return;
  document.getElementById("mKind").textContent=(icons[x.category]||"•")+" "+(labels[x.category]||x.category)+" "+(x.sub||"");
  document.getElementById("mName").textContent=x.name;document.getElementById("mEn").textContent=x.enName||"";
  document.getElementById("mDesc").textContent=x.desc||"-";document.getElementById("mPrimary").textContent=x.primary||x.desc||"-";
  document.getElementById("overlay").classList.add("show");
});
document.getElementById("close").onclick=()=>document.getElementById("overlay").classList.remove("show");
document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")e.currentTarget.classList.remove("show")};

const tz=[
["ACT 1","구덩이 (피트 1~2층)"],["ACT 4","혼돈의 성역"],["ACT 2","탈 라샤의 무덤"],["ACT 5","세계석 성채 & 파괴의 왕좌"],
["ACT 3","트라빈칼"],["ACT 1","비밀의 젖소 목장"],["ACT 5","혹한의 고산지"],["ACT 2","고대 하수도"]
];
function tick(){
 const d=new Date(), left=(59-d.getMinutes())*60+(59-d.getSeconds());
 document.getElementById("timer").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
 const h=Math.floor(d.getTime()/3600000), a=tz[Math.abs(h)%tz.length], n=tz[(Math.abs(h)+1)%tz.length];
 document.getElementById("tzAct").textContent=a[0];document.getElementById("tzName").textContent=a[1];document.getElementById("tzNext").textContent=n[0]+" "+n[1];
}
setInterval(tick,1000);tick();render();
</script>
