const LABEL={runeword:"룬워드",unique:"유니크",base:"베이스",cube:"큐빙",zone:"사냥터"};
const ICON={runeword:"◆",unique:"★",base:"▣",cube:"⬡",zone:"⌖"};
let category="all", zoneFilter="all", query="", selected=null;
const favorite=new Set(JSON.parse(localStorage.getItem("d2helper_fav")||"[]"));
const grid=document.getElementById("grid"), count=document.getElementById("count"), search=document.getElementById("search");

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function norm(s){return String(s??"").toLowerCase().replace(/\s+/g,"")}
function immuneClass(t){return ["cold","fire","light","phys","poison","magic","var"].includes(t)?t:"var"}

function updateSubFilters(){
 const box=document.getElementById("subfilters");
 if(category!=="zone"){box.className="subfilters";box.innerHTML="";return}
 const opts=[["all","전체 지역"],["waypoint","웨이포인트"],["hunt","일반 사냥터"],["ACT 1","ACT 1"],["ACT 2","ACT 2"],["ACT 3","ACT 3"],["ACT 4","ACT 4"],["ACT 5","ACT 5"]];
 box.className="subfilters show";
 box.innerHTML=opts.map(([k,n])=>`<button class="filterbtn ${zoneFilter===k?"active":""}" data-zf="${k}">${n}</button>`).join("");
}

function render(){
 const nq=norm(query);
 let rows=DATA.filter(x=>category==="all"||x.category===category);
 if(category==="zone"){
   rows=rows.filter(x=>zoneFilter==="all"|| (zoneFilter==="waypoint"&&x.hasWaypoint) || (zoneFilter==="hunt"&&!x.hasWaypoint) || x.slot===zoneFilter);
   rows.sort((a,b)=>(a.order||999)-(b.order||999));
 }
 rows=rows.filter(x=>!nq||norm([x.name,x.enName,x.desc,x.primary,x.sub,x.targetTitle,x.targetDesc].join(" ")).includes(nq));
 count.textContent=rows.length;
 grid.innerHTML=rows.length?rows.map(x=>`<article class="card" data-id="${esc(x.id)}">
 <button class="fav ${favorite.has(x.id)?"on":""}" data-fav="${esc(x.id)}">☆</button>
 <div class="kind">${ICON[x.category]||"•"} ${esc(x.sub||LABEL[x.category])} ${x.hasWaypoint?'<span class="wpdot">WP</span>':""}</div>
 <h3>${esc(x.name)}</h3><div class="en">${esc(x.enName||"")}</div>
 <div class="desc">${esc(x.category==="zone"?(x.targetTitle||x.desc):x.desc||x.primary||"")}</div>
 </article>`).join(""):`<div class="empty">검색 결과가 없습니다.</div>`;
}

function statsHtml(stats){
 if(!stats||!stats.length)return `<div class="note">상세 옵션 데이터가 없습니다.</div>`;
 return stats.map(s=>`<div class="statrow"><span>${esc(s.name)}</span><span>${esc(s.val)} ${s.var?`<small style="color:#8b7765;font-weight:400">${esc(s.var)}</small>`:""}</span></div>`).join("");
}

function normalDetail(x){
 let extra="";
 if(x.category==="base"){
   extra=`<div class="box"><div class="boxtitle">기본 수치 <span class="difficulty">일반 품질</span></div>
   <div class="basegrid">${(x.baseStats||[]).map(s=>`<div class="basecell"><small>${esc(s.label)}</small><b>${esc(s.val)}</b></div>`).join("")}</div>
   <div class="note">${esc(x.coreInfo||"")}</div></div>
   <div class="box"><div class="boxtitle">고급(슈페리어) 가능 옵션</div>${(x.supStats||[]).map(s=>`<div class="statrow"><span>${esc(s.label)}</span><span>${esc(s.val)}</span></div>`).join("")}</div>`;
 } else if(x.category==="runeword"){
   extra=`<div class="box"><div class="boxtitle">룬 순서 <span class="difficulty">Lv. ${esc(x.level||"-")}</span></div><div style="color:#f1c36b;font-weight:800;line-height:1.65">${esc(x.primary)}</div></div>
   <div class="box"><div class="boxtitle">전체 옵션</div>${statsHtml(x.fullStats)}</div>`;
 } else if(x.category==="unique"){
   extra=`<div class="box"><div class="boxtitle">고유 아이템 정보 <span class="difficulty">요구 Lv. ${esc(x.level||"-")}</span></div>
   <div class="target"><small>베이스</small><b>${esc(x.baseName||x.primary)}</b><p>변동 옵션은 아래 수치를 확인하세요.</p></div></div>
   <div class="box"><div class="boxtitle">전체 옵션</div>${statsHtml(x.fullStats)}</div>`;
 } else if(x.category==="cube"){
   extra=`<div class="box"><div class="boxtitle">큐빙 공식 <span class="difficulty">호라드림의 함</span></div><div style="color:#f0c06a;line-height:1.7;font-weight:700">${esc(x.primary)}</div><div class="note">재료를 모두 함 안에 넣고 변환 버튼을 누르세요.</div></div>`;
 }
 return `<div class="dhead"><div class="roundicon">${ICON[x.category]||"◇"}</div><div><div class="dtitle">${esc(x.name)}</div><div class="den">${esc(x.enName||"")}</div></div><div class="star">☆</div></div>
 <div class="sectionTitle">핵심 정보</div><div class="summaryLine">${esc(x.desc||x.primary||"")}</div>${extra}
 <div class="tags">${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
 <div class="tip"><i>!</i><div><b>모험가 팁</b><p>${x.category==="base"?"룬워드 제작 전 소켓 수와 아이템 종류를 반드시 확인하세요.":x.category==="unique"?"변동 옵션이 있는 유니크는 수치에 따라 가치가 크게 달라질 수 있습니다.":"게임 내 최신 패치와 실제 아이템 표기를 함께 확인하세요."}</p></div></div>`;
}

function zoneDetail(x){
 const im=(x.immunes||[]);
 const imHtml=x.safeZone?`<div class="immune var"><b>안전 지대</b><span>몬스터가 없는 마을 거점입니다.</span></div>`:
   im.map(m=>`<div class="immune ${immuneClass(m.type)}"><b>${esc(m.title)}</b><span>${esc(m.mob)}</span></div>`).join("");
 const al=x.areaLevel==null?"안전":x.areaLevel;
 const tags=(x.tags&&x.tags.length?x.tags:[`#${x.slot.replace(" ","")}`,x.hasWaypoint?"#웨이포인트":"#사냥터"]).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
 return `<div class="dhead"><div class="roundicon">⌖</div><div><div class="dtitle">${esc(x.name)}</div><div class="den">${esc(x.enName)}</div></div><div class="star">☆</div></div>
 <div class="sectionTitle">핵심 정보</div><div class="summaryLine">자주 등장하는 면역: ${esc(x.immunesSummary||"지역별 상이")}</div>
 <div class="box"><div class="boxtitle">자주 등장하는 면역 <span class="difficulty">지옥 난이도</span></div>${imHtml}<div class="note">고유·챔피언 몬스터의 추가 속성에 따라 다른 면역이 생길 수 있습니다.</div></div>
 <div class="box"><div class="boxtitle">파밍 정보</div><div class="kpis"><div class="kpi"><small>지역 레벨 · 헬 기준</small><strong>${esc(al)}</strong></div><div class="kpi"><small>기대 가능한 최고 룬</small><strong>${esc(x.maxRune||"상이지역")}</strong></div></div>
 <div class="target"><small>누굴 잡아야 하나요?</small><b>${esc(x.targetTitle||"정예·챔피언 무리")}</b><p>${esc(x.targetDesc||"정예·챔피언 중심으로 사냥하세요.")}</p></div>
 <div class="note">최고 룬은 난이도·몬스터 종류·개별 드롭 테이블에 따라 달라질 수 있습니다.</div></div>
 <div class="tzbox"><div class="tzhead"><span>공포의 영역 보정</span><label class="levelctrl">캐릭터 Lv.<input id="charLv" type="number" min="1" max="99" value="82"></label></div><div id="tzCalc"></div></div>
 <div class="tags">${tags}</div>
 <div class="tip"><i>!</i><div><b>모험가 팁</b><p>${esc(x.tip||"일반 몬스터만 지나치지 말고 챔피언과 고유 몬스터 무리를 함께 처치하세요.")}</p></div></div>`;
}

function updateTZCalc(){
 if(!selected||selected.category!=="zone")return;
 const input=document.getElementById("charLv"); if(!input)return;
 let lv=Math.max(1,Math.min(99,parseInt(input.value)||82));
 const normal=Math.min(96,lv+2), champ=Math.min(98,lv+4), unique=Math.min(99,lv+5);
 const state=normal>=87?"TC87 조건 충족":"TC87 조건 미달";
 document.getElementById("tzCalc").innerHTML=`<div class="tzkpis"><div class="tzkpi"><small>일반 몬스터</small><b>Lv. ${normal}</b></div><div class="tzkpi"><small>챔피언</small><b>Lv. ${champ}</b></div><div class="tzkpi"><small>고유·보스</small><b>Lv. ${unique}</b></div></div>
 <div class="tcstate"><b>${state}</b><p>일반 몬스터 기준 레벨이 87 이상인지 빠르게 확인하는 보조 표시입니다. 실제 아이템 드롭은 몬스터와 보물 등급 표에 따라 달라집니다.</p></div>`;
}

function openDetail(x){
 selected=x;
 document.getElementById("detail").innerHTML=x.category==="zone"?zoneDetail(x):normalDetail(x);
 document.body.classList.add("open"); document.getElementById("drawer").setAttribute("aria-hidden","false");
 if(x.category==="zone"){updateTZCalc();document.getElementById("charLv").addEventListener("input",updateTZCalc)}
}
function closeDetail(){document.body.classList.remove("open");document.getElementById("drawer").setAttribute("aria-hidden","true")}

search.addEventListener("input",e=>{query=e.target.value;render()});
document.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>{query=b.dataset.q;search.value=query;render()});
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");category=b.dataset.cat;zoneFilter="all";updateSubFilters();render()});
document.getElementById("subfilters").addEventListener("click",e=>{const b=e.target.closest("[data-zf]");if(!b)return;zoneFilter=b.dataset.zf;updateSubFilters();render()});
grid.addEventListener("click",e=>{const f=e.target.closest("[data-fav]");if(f){e.stopPropagation();const id=f.dataset.fav;favorite.has(id)?favorite.delete(id):favorite.add(id);localStorage.setItem("d2helper_fav",JSON.stringify([...favorite]));render();return}const c=e.target.closest(".card");if(!c)return;const x=DATA.find(v=>v.id===c.dataset.id);if(x)openDetail(x)});
document.getElementById("close").onclick=closeDetail;document.getElementById("backdrop").onclick=closeDetail;document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});

const TZ=["핏빛 황무지와 악의 소굴","차가운 평야와 동굴","검은 습지와 구멍","구덩이","고대 토굴","비전의 성역","탈 라샤의 무덤","트라빈칼","혼돈의 성역","세계석 성채와 파괴의 왕좌"];
function tick(){const d=new Date(),s=(59-d.getMinutes())*60+(59-d.getSeconds());document.getElementById("tzTimer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");const h=Math.floor(d.getTime()/3600000),i=((h%TZ.length)+TZ.length)%TZ.length;document.getElementById("tzCurrent").textContent=TZ[i];document.getElementById("tzNext").textContent=TZ[(i+1)%TZ.length]}
setInterval(tick,1000);tick();updateSubFilters();render();
</script>
</body>
</html>
