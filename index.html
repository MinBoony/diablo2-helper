function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function norm(s){return String(s??"").toLowerCase().replace(/\s+/g,"")}
function immuneClass(t){return ["cold","fire","light","phys","poison","magic","var"].includes(t)?t:"var"}

const EQUIP_FILTERS=[
  ["all","전체"],
  ["head","머리"],
  ["chest","가슴"],
  ["weapon_shield","무기/방패"],
  ["gloves","장갑"],
  ["boots","신발"],
  ["belt","벨트"],
  ["accessory","악세"]
];

function groupFromTypeCode(code){
  const c=String(code||"").toLowerCase().trim();
  if(!c) return "";
  if(["helm","circ","phlm","pelt"].includes(c)) return "head";
  if(["tors","armo"].includes(c)) return "chest";
  if(["glov"].includes(c)) return "gloves";
  if(["boot"].includes(c)) return "boots";
  if(["belt"].includes(c)) return "belt";
  if(["ring","rin","amul","amu","jewl","jew","char","cm1","cm2","cm3"].includes(c)) return "accessory";
  if([
    "shld","ashd","pala","head","necr","grim",
    "weap","mele","swor","axe","pole","spea","staf","scep","mace","hamm","club",
    "miss","bow","xbow","h2h","h2h2","knif","wand","orb","jave","tkni"
  ].includes(c)) return "weapon_shield";
  return "";
}

function equipmentGroup(x){
  if(!x) return "";
  if(x.equipGroup) return x.equipGroup;

  const codeGroup=groupFromTypeCode(x.typeCode||x.baseTypeCode||"");
  if(codeGroup) return codeGroup;

  const t=norm([
    x.slot,x.baseName,x.name,x.enName,x.sub,
    ...(x.aliases||[])
  ].join(" "));

  // 악세부터 먼저 분류
  if(/반지|링|ring|목걸이|아뮬|amulet|주얼|jewel|부적|charm/.test(t)) return "accessory";

  // 장갑 / 신발 / 벨트
  if(/장갑|글러브|glove|gauntlet|mitt/.test(t)) return "gloves";
  if(/장화|부츠|신발|boot|greave/.test(t)) return "boots";
  if(/허리띠|벨트|밸트|belt|sash/.test(t)) return "belt";

  // 머리
  if(/투구|헬름|헬멧|서클릿|코로넷|티아라|다이어뎀|helm|helmet|circlet|coronet|tiara|diadem|pelt/.test(t)) return "head";

  // 가슴
  if(/갑옷|아머|플레이트|메일|로브|armor|armour|plate|mail|robe|hauberk|cuirass/.test(t)) return "chest";

  // 무기/방패
  if(/방패|쉴드|shield|도검|검|소드|도끼|액스|미늘창|폴암|창|스피어|지팡이|스태프|홀|셉터|철퇴|메이스|망치|해머|활|보우|쇠뇌|크로스보우|클러|단검|대거|마법봉|완드|보주|오브|투창|재벌린|무기|weapon|sword|axe|polearm|spear|staff|scepter|mace|hammer|bow|crossbow|claw|dagger|wand|orb|javelin/.test(t)) return "weapon_shield";

  return "";
}

function updateSubFilters(){
  const box=document.getElementById("subfilters");

  if(category==="zone"){
    const opts=[
      ["all","전체 지역"],["waypoint","웨이포인트"],["hunt","일반 사냥터"],
      ["ACT 1","ACT 1"],["ACT 2","ACT 2"],["ACT 3","ACT 3"],["ACT 4","ACT 4"],["ACT 5","ACT 5"]
    ];
    box.className="subfilters show";
    box.innerHTML=opts.map(([k,n])=>
      `<button class="filterbtn ${zoneFilter===k?"active":""}" data-zf="${k}">${n}</button>`
    ).join("");
    return;
  }

  if(["runeword","unique","base"].includes(category)){
    const categoryRows=DATA.filter(x=>x.category===category);
    const counts={};
    EQUIP_FILTERS.forEach(([key])=>{
      counts[key]=key==="all"
        ? categoryRows.length
        : categoryRows.filter(x=>equipmentGroup(x)===key).length;
    });

    box.className="subfilters show";
    box.innerHTML=EQUIP_FILTERS.map(([k,n])=>
      `<button class="filterbtn ${equipFilter===k?"active":""}" data-eq="${k}">
        ${n}<span style="margin-left:5px;opacity:.62">${counts[k]}</span>
      </button>`
    ).join("");
    return;
  }

  box.className="subfilters";
  box.innerHTML="";
}

function zoneMatchesTZ(x,tzName){
  if(!x || x.category!=="zone" || !tzName) return false;
  const t=norm(cleanTZName(tzName));
  const candidates=[
    x.name,
    TZ_ZONE_PARENT_KO[x.name]||"",
    x.enName
  ].filter(Boolean);

  return candidates.some(v=>{
    const k=norm(cleanTZName(v));
    return k && (t.includes(k) || k.includes(t));
  });
}

function tzCardState(x){
  if(zoneMatchesTZ(x,CURRENT_TZ_NAME)) return "current";
  if(zoneMatchesTZ(x,NEXT_TZ_NAME)) return "next";
  return "";
}

function render(){
 const nq=norm(query);
 let rows=DATA.filter(x=>category==="all"||x.category===category);

 if(category==="zone"){
   rows=rows.filter(x=>zoneFilter==="all"|| (zoneFilter==="waypoint"&&x.hasWaypoint) || (zoneFilter==="hunt"&&!x.hasWaypoint) || x.slot===zoneFilter);
   rows.sort((a,b)=>(a.order||999)-(b.order||999));

   rows=rows.filter(x=>equipmentGroup(x)===equipFilter);

 rows=rows.filter(x=>!nq||norm([x.name,x.enName,x.desc,x.primary,x.sub,x.targetTitle,x.targetDesc,x.baseName,(x.aliases||[]).join(" "),x.code].join(" ")).includes(nq));
 count.textContent=rows.length;

 const tzState=tzCardState(x);

   ? '<span class="tz-card-badge current">● 현재 공포</span>'
   : tzState==="next"
     ? '<span class="tz-card-badge next">◆ 다음 공포</span>'

 if(!selected||selected.category!=="zone")return;
 const input=document.getElementById("charLv"); if(!input)return;
 let lv=Math.max(1,Math.min(99,parseInt(input.value)||82));

 // 공포의 영역 몬스터 레벨 보정
 const normal=Math.min(96,lv+2);
 const champ=Math.min(98,lv+4);
 const unique=Math.min(99,lv+5);

 // "TC85/TC87 조건"처럼 캐릭터 레벨과 TC를 같은 개념으로 보이지 않도록 분리 표시
 const normalState = normal>=87 ? "최고급 베이스 드롭권 진입" : `몬스터 Lv.${normal}`;
 const champState  = champ>=87  ? "최고급 베이스 드롭권 진입" : `몬스터 Lv.${champ}`;
 const uniqueState = unique>=87 ? "최고급 베이스 드롭권 진입" : `몬스터 Lv.${unique}`;

 document.getElementById("tzCalc").innerHTML=`
 <div class="tzkpis">
   <div class="tzkpi"><small>일반 몬스터</small><b>Lv. ${normal}</b></div>
   <div class="tzkpi"><small>챔피언</small><b>Lv. ${champ}</b></div>
   <div class="tzkpi"><small>고유·보스</small><b>Lv. ${unique}</b></div>
 </div>

 <div class="tcstate">
   <b>공포의 영역 드롭 조건 안내</b>
   <p>
     일반: ${normalState}<br>
     챔피언: ${champState}<br>
     고유·보스: ${uniqueState}
   </p>
   <p style="margin-top:7px">
     ※ 캐릭터 레벨과 TC는 같은 개념이 아닙니다.<br>
     ※ '지역 레벨 85'는 캐릭터가 85레벨이어야 한다는 뜻이 아닙니다.<br>
     ※ 실제 아이템 드롭은 몬스터의 Treasure Class(TC), 아이템 Qlvl, 몬스터 레벨에 따라 최종 결정됩니다.
   </p>
 </div>`;
}

function openDetail(x){
 selected=x;
 document.getElementById("detail").innerHTML=x.category==="zone"?zoneDetail(x):normalDetail(x);
 document.body.classList.add("open"); document.getElementById("drawer").setAttribute("aria-hidden","false");
 if(x.category==="zone"){
   updateTZCalc();
   document.getElementById("charLv").addEventListener("input",updateTZCalc);
   if(isCountessZone(x)){
     const wrap=document.getElementById("countessDropWrap");
     if(wrap){
       wrap.addEventListener("click",e=>{
         const b=e.target.closest("[data-countess-mode]");
         if(!b)return;
         wrap.innerHTML=countessTableHtml(b.dataset.countessMode);
       });
     }
   }
 }
}

function cleanTZName(v){
  let s=String(v||"")
    .replace(/^\s*(?:ACT|Act|액트)\s*[1-5]\s*[·:—–-]\s*/i,"")
    .replace(/&amp;/gi,"&")
    .replace(/[“”]/g,'"')
    .replace(/[’]/g,"'")
    .replace(/\s+/g," ")
    .trim();

  if(!s) return "";

  /* 1. 트래커 묶음명 정확 일치 */
  if(TZ_KO[s]) return TZ_KO[s];

  /* 2. 개별 지역명을 긴 이름부터 치환 */
  let out=s;
  Object.keys(TZ_AREA_KO)
    .sort((a,b)=>b.length-a.length)
    .forEach(en=>{
      if(out.toLowerCase().includes(en.toLowerCase())){
        out=out.replace(new RegExp(en.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),TZ_AREA_KO[en]);
      }
    });

  /* 3. 영어 연결어/구분자 정리 */
  out=out
    .replace(/\s+(?:and|&)\s+/gi,", ")
    .replace(/\s*\/\s*/g,", ")
    .replace(/\s*\+\s*/g,", ")
    .replace(/\s*,\s*/g,", ")
    .replace(/\bLevel\s*(\d+)\b/gi,"$1층")
    .replace(/\bTemple Halls\b/gi,"전당")
    .replace(/\bThe\b/gi,"")
    .replace(/\s+/g," ")
    .replace(/,\s*,+/g,",")
    .replace(/^,\s*|\s*,$/g,"")
    .trim();

  /* 영어가 남는 예외는 화면에 그대로 노출하지 않고 한국어 상태 표시 */
  if(/[A-Za-z]/.test(out)){
    console.warn("미번역 공포의 영역명:",s);
    return "공포의 영역 정보 확인 중";
  }
  return out;
}

function parseBaeklab(text){
  const t=String(text||"").replace(/\r/g,"");
  const cur=t.match(/현재 공포의 영역[\s\S]{0,120}?(?:##\s*)?([^\n#]+?)(?:\n|$)/i);
  const next=t.match(/다음 공포의 영역[\s\S]{0,120}?(?:##\s*)?([^\n#]+?)(?:\n|$)/i);
  if(!cur) return null;
  return {current:cleanTZName(cur[1]), next:next?cleanTZName(next[1]):"", source:"baeklab"};
}

function parseTerrorZoneTracker(text){
  const t=String(text||"").replace(/\r/g,"");
  const cur=t.match(/Current Zone\s*(?:◂)?[\s\S]{0,80}?(?:##\s*)?([^\n]+)/i);
  const next=t.match(/Queued Next\s*(?:◂)?\s*(?:##\s*)?([^\n]+)/i);
  if(!cur) return null;
  return {current:cleanTZName(cur[1]), next:next?cleanTZName(next[1]):"", source:"terrorzonetracker"};
}

function parseRunewizard(text){
  const t=String(text||"").replace(/\r/g,"");
  const cur=t.match(/Current Terror Zone[\s\S]{0,100}?(?:##\s*)?([^\n]+)/i);
  const next=t.match(/Next Terror Zone(?: in [^\n]+)?[\s\S]{0,100}?(?:##\s*)?([^\n]+)/i);
  if(!cur) return null;
  const current=cleanTZName(cur[1]);
  if(!current || /immunities|image:/i.test(current)) return null;
  return {current, next:next?cleanTZName(next[1]):"", source:"d2runewizard"};
}

async function fetchFreshJina(originalUrl, parser){
  const bust=Date.now()+"-"+Math.random().toString(36).slice(2);
  const proxied="https://r.jina.ai/http://"+originalUrl.replace(/^https?:\/\//,"")+
    (originalUrl.includes("?")?"&":"?")+"_tzcb="+encodeURIComponent(bust);
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),9000);
  try{
    const r=await fetch(proxied,{
      cache:"no-store",
      signal:ctrl.signal,
      headers:{
        "X-No-Cache":"true",
        "X-Return-Format":"markdown",
        "Cache-Control":"no-cache"
      }
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    const info=parser(await r.text());
    return info&&info.current?info:null;
  } finally { clearTimeout(timer); }
}

function normalizeForVote(v){
  return cleanTZName(v).replace(/[·,/&+]/g," ").replace(/\s+/g," ").trim();
}

function chooseBest(results){
  const valid=results.filter(Boolean);
  if(!valid.length) return null;

  const buckets=new Map();
  for(const r of valid){
    const key=normalizeForVote(r.current);
    if(!buckets.has(key)) buckets.set(key,[]);
    buckets.get(key).push(r);
  }
  const ranked=[...buckets.entries()].sort((a,b)=>b[1].length-a[1].length);
  const bestGroup=ranked[0][1];

  // 2개 이상 일치하면 그 결과를 확정
  if(bestGroup.length>=2) {
    const best=bestGroup[0];
    const nextVotes=bestGroup.map(x=>x.next).filter(Boolean);
    return {...best,next:nextVotes[0]||best.next,confirmed:true};
  }

  // 한 소스만 살아있을 때도 표시하되 "단일 소스"로 상태 표시
  return {...valid[0],confirmed:false};
}

let lastGoodTZ=null;
let tzRefreshing=false;

async function refreshTerrorZone(){
  if(tzRefreshing) return;
  tzRefreshing=true;
  const currentEl=document.getElementById("tzCurrent");
  const nextEl=document.getElementById("tzNext");

  try{
    const settled=await Promise.allSettled([
      fetchFreshJina("terrorzonetracker.com/",parseTerrorZoneTracker),
      fetchFreshJina("d2runewizard.com/tz-tracker",parseRunewizard),
      fetchFreshJina("d2r.baeklab.com/ko/terror-zone",parseBaeklab)
    ]);
    const infos=settled.map(x=>x.status==="fulfilled"?x.value:null);
    const best=chooseBest(infos);

    if(best){
      lastGoodTZ={...best,at:Date.now()};
      const currentName=cleanTZName(best.current);
      const act=actFromName(currentName);
      const nextName=cleanTZName(best.next);
      const nextAct=actFromName(nextName);

      CURRENT_TZ_NAME=currentName;
      NEXT_TZ_NAME=nextName;

      currentEl.textContent=(act?act+" · ":"")+currentName;
      nextEl.textContent=nextName ? ((nextAct?nextAct+" · ":"")+nextName) : "다음 지역 예측 대기 중";
      currentEl.title=best.confirmed
        ?"복수 실시간 트래커 일치"
        :"실시간 단일 트래커 기준";

      render();
      return;
    }

    if(lastGoodTZ && Date.now()-lastGoodTZ.at<4*60*1000){
      const currentName=cleanTZName(lastGoodTZ.current);
      const act=actFromName(currentName);
      const nextName=cleanTZName(lastGoodTZ.next);
      const nextAct=actFromName(nextName);

      CURRENT_TZ_NAME=currentName;
      NEXT_TZ_NAME=nextName;

      currentEl.textContent=(act?act+" · ":"")+currentName;
      nextEl.textContent=nextName ? ((nextAct?nextAct+" · ":"")+nextName) : "재동기화 중";
      currentEl.title="최근 정상 수신값 · 재동기화 중";
      render();
    }else{
      CURRENT_TZ_NAME="";
      NEXT_TZ_NAME="";
      currentEl.textContent="실시간 정보 재동기화 중";
      nextEl.textContent="잠시 후 자동 재시도";
      render();
    }
  } finally {
    tzRefreshing=false;
  }
}

 "dmg-demon","dmg-undead","att-demon","att-undead","hp%","mana%","extra-cold","extra-fire",
 "extra-ltng","extra-pois","res-pois-len","stamdrain"
]);

function parseTSV(text){
  const lines=String(text||"").replace(/\r/g,"").split("\n");
  const head=(lines.shift()||"").split("\t");
  return lines.filter(line=>line.trim() && !/^Expansion\s*$/.test(line.trim())).map(line=>{
    const cols=line.split("\t"), obj={};
    head.forEach((h,i)=>obj[h]=cols[i]??"");
    return obj;
  });
}

async function fetchAny(urls){
  let lastErr=null;
  for(const url of urls){
    const ctrl=new AbortController();
    const tm=setTimeout(()=>ctrl.abort(),15000);
    try{
      const r=await fetch(url+(url.includes("?")?"&":"?")+"v=20260905",{cache:"no-store",signal:ctrl.signal});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const text=await r.text();
      if(text.length<20) throw new Error("empty source");
      clearTimeout(tm);
      return text;
    }catch(e){
      clearTimeout(tm);
      lastErr=e;
    }
  }
  throw lastErr||new Error("source unavailable");
}

function cleanGameText(v){
  return String(v||"")
    .replace(/ÿc./g,"")
    .replace(/\\n/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function safeId(v){
  return String(v||"item").toLowerCase().replace(/[^a-z0-9가-힣]+/g,"_").replace(/^_+|_+$/g,"");
}

function localName(locale,key,fallback){
  return cleanGameText((locale&&locale[key])||fallback||key);
}

function rangeValue(code,min,max,param){
  min=String(min??"").trim(); max=String(max??"").trim(); param=String(param??"").trim();

  if(["ignore-ac","noheal","nofreeze","indestruct","knock","rip"].includes(code))
    return "적용";

  if(["hit-skill","gethit-skill","kill-skill","death-skill","levelup-skill","att-skill"].includes(code)){
    const chance=min||"?";
    const level=max||"?";
    return `${chance}% 확률 · Lv.${level} ${param||"기술"}`;
  }
  if(code==="aura"){
    return `Lv.${min===max?min:(min+"~"+max)} ${param||"오라"}`;
  }
  if(code==="charged"){
    return `Lv.${max||"?"} ${param||"기술"} (${min||"?"}회 충전)`;
  }
  if(["skill","oskill","skilltab"].includes(code)){
    const val=min===max?min:(min&&max?min+"~"+max:(min||max));
    return `+${val||"?"} ${param||""}`.trim();
  }

  let val="";
  if(min && max) val=min===max?min:`${min}~${max}`;
  else val=min||max||"적용";

  const n1=Number(min),n2=Number(max);
  const numeric=(min!==""&&!Number.isNaN(n1))||(max!==""&&!Number.isNaN(n2));
  if(numeric && !String(val).startsWith("-") && !String(val).startsWith("+") && !["dmg-fire","dmg-cold","dmg-ltng","dmg-pois","dmg-mag","dmg-elem"].includes(code))
    val="+"+val;
  if(PERCENT_PROPS.has(code) && !String(val).endsWith("%")) val+="%";
  if(param && !["0","1"].includes(param)) val+=` (${param})`;
  return val;
}

function propRow(code,param,min,max){
  if(!code) return null;
  return {
    name:PROP_KO[code]||code,
    val:rangeValue(code,min,max,param),
    var:(String(min||"")!==String(max||"") && min!=="" && max!=="")?"(변동)":""
  };
}

function parseRunewordStats(row){
  const out=[];
  for(let i=1;i<=7;i++){
    const p=propRow(row[`T1Code${i}`],row[`T1Param${i}`],row[`T1Min${i}`],row[`T1Max${i}`]);
    if(p) out.push(p);
  }
  return out;
}

function parseUniqueStats(row){
  const out=[];
  for(let i=1;i<=12;i++){
    const p=propRow(row[`prop${i}`],row[`par${i}`],row[`min${i}`],row[`max${i}`]);
    if(p) out.push(p);
  }
  return out;
}

function runeList(row){
  return [1,2,3,4,5,6].map(i=>row[`Rune${i}`]).filter(Boolean);
}

function runewordLevel(row){
  return runeList(row).reduce((m,c)=>Math.max(m,(RUNE_INFO[c]||["","",0])[2]),0);
}

function runeRecipe(row){
  return runeList(row).map(c=>{
    const r=RUNE_INFO[c]||[c,c,0];
    const num=parseInt(String(c).replace(/\D/g,""),10)||"";
    return `${r[1]}${num?`(${num})`:""}`;
  }).join(" + ");
}

function allowedBaseLabels(row){
  const arr=[1,2,3,4,5,6].map(i=>row[`itype${i}`]).filter(Boolean).map(x=>TYPE_KO[x]||x);
  return [...new Set(arr)];
}

function fixedKoreanBaseName(name){
  const replace={
    "패이즈 블레이드":"페이즈 블레이드",
    "모나크":"모너크",
    "쎄이크리드 타아지":"세이크리드 타아지",
    "쎄이크리드 론다쉬":"세이크리드 론다쉬"
  };
  return replace[name]||name;
}

function tierOf(row){
  const code=row.code||"";
  if(code && code===row.normcode) return "일반";
  if(code && code===row.ubercode) return "익셉셔널";
  if(code && code===row.ultracode) return "엘리트";
  return row.version==="100"?"확장":"일반";
}

function baseTypeLabel(row){
  return TYPE_KO[row.type]||TYPE_KO[row.type2]||row.type||row.type2||"장비";
}

function makeBase(row,kind,locale){
  const ko=fixedKoreanBaseName(localName(locale,row.namestr||row.code,row.name));
  const tier=tierOf(row);
  const sockets=Number(row.gemsockets||0);
  const reqLv=Number(row.levelreq||0);
  const reqStr=Number(row.reqstr||0), reqDex=Number(row.reqdex||0);
  const dur=Number(row.durability||0);
  const type=baseTypeLabel(row);
  const stats=[];

  if(kind==="weapon"){
    if(row.mindam||row.maxdam) stats.push({label:"한손 피해",val:`${row.mindam||0}~${row.maxdam||0}`});
    if(row["2handmindam"]||row["2handmaxdam"]) stats.push({label:"양손 피해",val:`${row["2handmindam"]||0}~${row["2handmaxdam"]||0}`});
    if(row.minmisdam||row.maxmisdam) stats.push({label:"투사체 피해",val:`${row.minmisdam||0}~${row.maxmisdam||0}`});
    stats.push({label:"기본 공속",val:String(row.speed||0)});
  }else{
    stats.push({label:"방어력",val:`${row.minac||0}~${row.maxac||0}`});
    if(Number(row.block||0)) stats.push({label:"기본 막기",val:`${row.block}%`});
  }
  if(sockets) stats.push({label:"최대 소켓",val:String(sockets)});
  if(reqStr) stats.push({label:"필요 힘",val:String(reqStr)});
  if(reqDex) stats.push({label:"필요 민첩",val:String(reqDex)});
  if(reqLv) stats.push({label:"요구 레벨",val:String(reqLv)});
  if(dur) stats.push({label:"내구도",val:String(dur)});

  const sup=kind==="weapon"
    ? [
       {label:"고급 피해 증가",val:"+5~15% 가능"},
       {label:"고급 명중률",val:"+1~3 가능"},
       {label:"최대 내구도 증가",val:"+10~15% 가능"}
      ]
    : [
       {label:"고급 방어력 증가",val:"+5~15% 가능"},
       {label:"최대 내구도 증가",val:"+10~15% 가능"}
      ];

  const ethPossible=String(row.nodurability||"0")!=="1" && dur>0;
  return {
    id:`base_full_${safeId(row.code)}`,
    category:"base",
    slot:type,
    name:ko,
    enName:row.name,
    code:row.code,
    aliases:[row.name,row.code,row.namestr,tier,type].filter(Boolean),
    sub:`${tier} · ${type}${sockets?` · 최대 ${sockets}소켓`:""}`,
    desc:`${tier} ${type} 베이스${reqLv?` · 요구 레벨 ${reqLv}`:""}`,
    primary:`${type} · ${tier}`,
    baseStats:stats,
    supStats:sup,
    coreInfo:`${ethPossible?"에테리얼 가능 · ":""}${sockets?`최대 ${sockets}소켓 · `:""}룬워드 제작 시 정확한 아이템 종류와 소켓 수를 확인하세요.`,
    tier,
    sockets,
    typeCode:row.type||row.type2||"",
    equipGroup:groupFromTypeCode(row.type||row.type2||""),
    source:"D2R weapons/armor"
  };
}

function mergePreferStatic(generated,staticMap){
  const hit=staticMap.get(norm(generated.enName||""));
  if(!hit) return generated;
  return {
    ...generated,
    ...hit,
    id:generated.id,
    aliases:[...(generated.aliases||[]),hit.name,hit.enName].filter(Boolean),
    source:generated.source
  };
}

async function loadFullDatabase(){
  const status=document.getElementById("dbStatus");
  if(status) status.textContent="룬워드 · 유니크 · 베이스 전체 데이터 불러오는 중…";

  try{
    const [runesText,uniqText,weapText,armorText,miscText,localeText]=await Promise.all([
      fetchAny(FULL_DB_URLS.runes),fetchAny(FULL_DB_URLS.unique),fetchAny(FULL_DB_URLS.weapons),
      fetchAny(FULL_DB_URLS.armor),fetchAny(FULL_DB_URLS.misc),fetchAny(FULL_DB_URLS.locale)
    ]);

    const runes=parseTSV(runesText);
    const uniques=parseTSV(uniqText);
    const weapons=parseTSV(weapText);
    const armors=parseTSV(armorText);
    const misc=parseTSV(miscText);
    let locale={};
    try{ locale=JSON.parse(localeText); }catch(e){ locale={}; }

    const existingRW=new Map(FALLBACK_DATA.filter(x=>x.category==="runeword").map(x=>[norm(x.enName),x]));
    const existingUQ=new Map(FALLBACK_DATA.filter(x=>x.category==="unique").map(x=>[norm(x.enName),x]));
    const existingBase=new Map(FALLBACK_DATA.filter(x=>x.category==="base").map(x=>[norm(x.enName),x]));

    const fullRW=runes.filter(r=>String(r.complete)==="1").map((r,idx)=>{
      const en=cleanGameText(r["*Rune Name"]||r.Name);
      const bases=allowedBaseLabels(r);
      const excluded=[r.etype1,r.etype2,r.etype3].filter(Boolean).map(x=>TYPE_KO[x]||x);
      const lv=runewordLevel(r);
      const generated={
        id:`rw_full_${safeId(r.Name)}_${idx}`,
        category:"runeword",
        slot:bases.join(" · ")||"룬워드 베이스",
        name:MODERN_RW_KO[en]||localName(locale,r.Name,en),
        enName:en,
        aliases:[en,r.Name,localName(locale,r.Name,""),r["*RunesUsed"],...runeList(r).map(c=>(RUNE_INFO[c]||[c,c])[0])].filter(Boolean),
        sub:`요구 레벨 ${lv} · ${runeList(r).length}소켓 · ${bases.join("/")||"지정 베이스"}`,
        desc:`${runeList(r).length}소켓 ${bases.join(" / ")||"지정 베이스"} · ${runeRecipe(r)}${excluded.length?` · 제외: ${excluded.join(", ")}`:""}`,
        primary:runeRecipe(r),
        level:lv,
        fullStats:parseRunewordStats(r),
        statsComplete:false,
        equipGroup:(()=>{
          const rawTypes=[1,2,3,4,5,6].map(i=>r[`itype${i}`]).filter(Boolean);
          const groups=[...new Set(rawTypes.map(groupFromTypeCode).filter(Boolean))];
          if(groups.length===1) return groups[0];
          // 무기 + 방패 같이 허용되는 룬워드는 사용자 요청대로 한 그룹
          if(groups.every(g=>g==="weapon_shield")) return "weapon_shield";
          // 투구 전용, 갑옷 전용은 각각 따로
          if(groups.includes("head") && groups.length===1) return "head";
          if(groups.includes("chest") && groups.length===1) return "chest";
          // 혼합형 룬워드는 실제 사용처가 많은 무기/방패 그룹으로 분류
          if(groups.includes("weapon_shield")) return "weapon_shield";
          if(groups.includes("head")) return "head";
          if(groups.includes("chest")) return "chest";
          return "";
        })(),
        source:"D2R runes.txt"
      };
      return mergePreferStatic(generated,existingRW);
    });

    // 유니크 베이스 코드 -> 한글/영문명
    const baseCodeMap=new Map();
    [...weapons,...armors,...misc].forEach(r=>{
      if(!r.code) return;
      baseCodeMap.set(r.code,{
        en:r.name||r["*ItemName"]||r.code,
        ko:fixedKoreanBaseName(localName(locale,r.namestr||r.code,r.name||r.code)),
        typeCode:r.type||r.type2||"",
        equipGroup:groupFromTypeCode(r.type||r.type2||"")
      });
    });

    // '전부' 요청에 맞춰 uniqueitems.txt의 439개 정의를 모두 등록.
    // 게임에서 실제 드롭 가능한지는 카드/상세에 상태로 표시.
    const fullUQ=uniques.map((r,idx)=>{
      const en=cleanGameText(r.index||r["*ItemName"]||`Unique ${idx+1}`);
      const base=baseCodeMap.get(r.code)||{en:r.code||"Unknown Base",ko:r.code||"알 수 없는 베이스"};
      const disabled=String(r.disabled)==="1";
      const spawnable=String(r.spawnable)==="1";
      const first=r.firstLadderSeason||"", last=r.lastLadderSeason||"";
      let state=disabled?"비활성 데이터":(spawnable?"일반 게임 등장 가능":"일반 드롭 불가/특수");
      if(first) state+=` · 래더 시즌 ${first}${last?`~${last}`:"+"}`;
      const generated={
        id:`unique_full_${safeId(r.index)}_${idx}`,
        category:"unique",
        slot:base.ko,
        name:localName(locale,r.index,en),
        enName:en,
        code:r.code,
        aliases:[en,r.index,r["*ItemName"],base.en,base.ko,r.code].filter(Boolean),
        sub:`요구 레벨 ${r["lvl req"]||0} · ${base.ko}`,
        desc:`${state} · Qlvl ${r.lvl||0}`,
        primary:`베이스: ${base.ko} · ${state}`,
        level:Number(r["lvl req"]||0),
        qlvl:Number(r.lvl||0),
        baseName:base.ko,
        typeCode:base.typeCode||"",
        equipGroup:base.equipGroup||"",
        dropState:state,
        fullStats:parseUniqueStats(r),
        tags:[`#${state.split(" · ")[0]}`,`#Qlvl${r.lvl||0}`],
        source:"D2R uniqueitems.txt"
      };
      return mergePreferStatic(generated,existingUQ);
    });

    // 실제 인벤토리에 존재하고 생성 가능한 무기/방어구를 전부 베이스 DB로
    const fullBases=[
      ...weapons.filter(r=>String(r.spawnable)==="1" && String(r.hasinv)!=="0").map(r=>makeBase(r,"weapon",locale)),
      ...armors.filter(r=>String(r.spawnable)==="1" && String(r.hasinv)!=="0").map(r=>makeBase(r,"armor",locale))
    ].map(x=>mergePreferStatic(x,existingBase));

    // 중복 ID 방지
    const seen=new Set();
    const dedupe=arr=>arr.filter(x=>{
      const k=x.category+"|"+norm(x.enName||x.name)+"|"+(x.code||"");
      if(seen.has(k)) return false;
      seen.add(k); return true;
    });

    const staticOther=FALLBACK_DATA.filter(x=>x.category==="cube"||x.category==="zone");
    seen.clear();
    DATA=[
      ...dedupe(fullRW),
      ...dedupe(fullUQ),
      ...dedupe(fullBases),
      ...staticOther
    ];

    const counts={
      rw:DATA.filter(x=>x.category==="runeword").length,
      uq:DATA.filter(x=>x.category==="unique").length,
      bs:DATA.filter(x=>x.category==="base").length
    };

    if(status){
      status.textContent=`전체 DB 완료 · 룬워드 ${counts.rw} · 유니크 ${counts.uq} · 베이스 ${counts.bs}`;
      status.title="현재 D2R 게임 데이터 테이블 기반";
    }
    updateSubFilters();
    render();
  }catch(err){
    console.error("Full database load failed:",err);
    DATA=FALLBACK_DATA.slice();
    if(status){
      status.textContent="전체 DB 연결 실패 · 기본 내장 데이터 사용 중";
      status.title=String(err&&err.message||err);
    }
    updateSubFilters();
    render();
  }
}

let lastBoundaryKey="";
function tickTerrorTimer(){
  const d=new Date();
  const elapsed=(d.getMinutes()%30)*60+d.getSeconds();
  const remain=1800-elapsed;
  document.getElementById("tzTimer").textContent=
    String(Math.floor(remain/60)).padStart(2,"0")+":"+
    String(remain%60).padStart(2,"0");

  const key=d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()+"-"+d.getHours()+"-"+Math.floor(d.getMinutes()/30);
  if(key!==lastBoundaryKey){
    lastBoundaryKey=key;
    // 회전 직후 API/트래커 전파 지연을 감안해 여러 번 재확인
    [10000,25000,55000,90000].forEach(ms=>setTimeout(refreshTerrorZone,ms));
  }
}

setInterval(tickTerrorTimer,1000);
setInterval(refreshTerrorZone,45000);
tickTerrorTimer();
refreshTerrorZone();
updateSubFilters();
render();
loadFullDatabase();
</script>
